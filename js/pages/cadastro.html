<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="icon" href="../../assets/icons/favicon.ico">
  <link rel="stylesheet" href="../../css/main.css">
  <script src="../../js/components/site-header.js" defer></script>
  <script src="../../js/components/site-footer.js" defer></script>

  <script type="module" src="../pages/cadastro.js"></script>
</head>

<body>
  <site-header></site-header>

  <div class="container">
    <div class="cadastro">
      <form id="form-cadastro" class="formulario">
        <h1>Preencha seus dados</h1>

        <label for="nome">Nome</label>
        <input type="text" id="nome" required>


        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" required>

        <label for="cep">CEP</label>
        <input type="text" id="cep" placeholder="00000-000" required>

        <label for="logradouro">Rua</label>
        <input type="text" id="logradouro">

        <label for="bairro">Bairro</label>
        <input type="text" id="bairro">

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade">

        <label for="uf">UF</label>
        <input type="text" id="uf" maxlength="2">

        <label for="isenha">Senha:</label>
        <input type="password" name="senha" id="isenha" placeholder="sua senha" ninlength="5" maxlength="15">

        <label for="iconfSenha">Confirme sua senha:</label>
        <input type="password" name="confSenha" id="iconfSenha" placeholder="digite novamente sua senha">

        <button type="submit" class="btn btn--primary">Cadastrar</button>
        <p class="rodape-form">Já tem conta? <a href="login.html">Entrar</a></p>
      </form>

    </div>
  </div>
  <site-footer></site-footer>
</body>

</html>
